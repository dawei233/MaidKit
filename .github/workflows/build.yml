name: Build Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - linux
          - android

jobs:
  build-windows:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # super_native_extensions (via desktop_webview_window) builds Rust code
      # through cargokit. GitHub Actions runners have no Rust preinstalled, and
      # cargokit's auto-installer crashes on `C:\Users\runneradmin\AppData`,
      # so install rustup explicitly before building.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      # libghostty (the vendored Ghostty terminal) compiles its native library
      # from source with Zig via a native-assets hook. GitHub Actions runners
      # do not ship Zig, so install it explicitly before building. Download is
      # done manually because Zig 0.15.x renamed its Windows tarball to
      # zig-x86_64-windows-<ver>.zip, which setup-zig actions do not know.
      - name: Set up Zig
        shell: pwsh
        run: |
          $url = "https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "D:\zig" -Force
          $zigExe = Get-ChildItem "D:\zig" -Recurse -Filter "zig.exe" | Select-Object -First 1
          if (-not $zigExe) { throw "zig.exe not found after extraction" }
          $binDir = Split-Path $zigExe.FullName
          Write-Host "zig at $binDir"
          "PATH=$env:PATH;$binDir" | Out-File -Append -FilePath $env:GITHUB_ENV
      # The tailscale package builds its native assets from Go source and
      # requires Go 1.26+, while GitHub Actions runners only ship older Go.
      # Install a recent Go explicitly before building.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      # Go defaults its build cache to %LocalAppData%\go-build, but the
      # runner's AppData tree is broken (LocalAppData is undefined), which
      # makes `go build` fail with "GOCACHE is not defined". Point GOCACHE
      # at a plain directory on D: instead.
      - name: Configure Go cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\go-cache" | Out-Null
          "GOCACHE=D:\go-cache" | Out-File -Append -FilePath $env:GITHUB_ENV
      # cargokit's resolve_symlinks.ps1 (used by super_native_extensions)
      # resolves .plugin_symlinks targets segment by segment with Get-Item.
      # On GitHub Actions the default pub cache lives under
      # C:\Users\runneradmin\AppData which is a broken path on the runner
      # (Get-Item keeps failing even after the directory is created). Redirect
      # PUB_CACHE to a plain directory on D: so symlink targets are always
      # resolvable. Must run before `flutter pub get`.
      - name: Redirect pub cache for cargokit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\pub-cache" | Out-Null
          "PUB_CACHE=D:\pub-cache" | Out-File -Append -FilePath $env:GITHUB_ENV
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # The tailscale native-assets hook compiles Go code, but hooks run in a
      # filtered environment (hooks_runner whitelist) that never includes
      # GOCACHE/LocalAppData, and the runner's AppData tree is broken, so the
      # Go build inside the hook always fails on Windows. Workaround: run the
      # build once (fails, but creates the hook output dir), pre-compile the
      # tailscale.dll manually with GOCACHE set, then rebuild - the hook's
      # idempotency check (_outputIsUpToDate) then skips `go build`.
      - name: First build (create hook dirs, expected to fail)
        id: build_first
        run: flutter build windows --release
        continue-on-error: true
      # tailscale 0.8.0's Windows build is broken upstream: symbols like
      # closeAllUdpBindings / httpBindingMu are only defined in *_posix.go
      # (!windows) files, so `go build` fails on Windows. Patch the pub-cache
      # copy with empty stubs (node_gate.go only uses Lock/Unlock/len), then
      # pre-compile tailscale.dll into the hook output dir so the hook's
      # idempotency check skips its own (broken) go build.
      - name: Pre-compile tailscale.dll into hook output dir
        shell: pwsh
        run: |
          $goDir = "D:\pub-cache\hosted\pub.dev\tailscale-0.8.0\go"
          Add-Content -Path (Join-Path $goDir "http_fd_unsupported.go") -Encoding utf8 -Value @"

          // ---- Windows stubs (upstream 0.8.0 regression) ----
          type httpBindingMuStub struct{}

          func (httpBindingMuStub) Lock()   {}
          func (httpBindingMuStub) Unlock() {}

          var httpBindingMu httpBindingMuStub
          var httpBindingRegistry = map[int64]struct{}{}

          func resetTailnetHTTPTransport() {}
"@
          Add-Content -Path (Join-Path $goDir "tcp_fd_unsupported.go") -Encoding utf8 -Value @"

          // ---- Windows stubs (upstream 0.8.0 regression) ----
          type tcpFdListenerMuStub struct{}

          func (tcpFdListenerMuStub) Lock()   {}
          func (tcpFdListenerMuStub) Unlock() {}

          var tcpFdListenerMu tcpFdListenerMuStub
          var tcpFdListenerRegistry = map[int64]struct{}{}
"@
          Add-Content -Path (Join-Path $goDir "udp_fd_unsupported.go") -Encoding utf8 -Value @"

          // ---- Windows stubs (upstream 0.8.0 regression) ----
          type udpFdBindingMuStub struct{}

          func (udpFdBindingMuStub) Lock()   {}
          func (udpFdBindingMuStub) Unlock() {}

          var udpFdBindingMu udpFdBindingMuStub
          var udpFdBindingRegistry = map[int64]struct{}{}

          func closeAllUdpBindings() {}
"@
          Write-Host "patched tailscale stubs"
          $env:GOCACHE = "D:\go-cache"
          $hookDir = Get-ChildItem ".dart_tool\hooks_runner\shared\tailscale\build" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $hookDir) {
            New-Item -ItemType Directory -Force -Path ".dart_tool\hooks_runner\shared\tailscale\build\tmp" | Out-Null
            $hookDir = Get-ChildItem ".dart_tool\hooks_runner\shared\tailscale\build" -Directory | Select-Object -First 1
          }
          Write-Host "hookDir=$($hookDir.FullName)"
          go build -C $goDir -buildmode=c-shared -o (Join-Path $hookDir.FullName "tailscale.dll") ./cmd/dylib
          Get-Item (Join-Path $hookDir.FullName "tailscale.dll") | Select-Object FullName, Length
      - name: Build Windows
        run: flutter build windows --release
      - name: Upload native assets logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-assets-logs
          path: |
            build/windows/x64/flutter/native_assets/
            .dart_tool/native_assets/
            .dart_tool/hooks_runner/
          if-no-files-found: ignore
      - name: Extract Version
        id: extract_version
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          if ($pubspec -match 'version:\s*(\d+\.\d+\.\d+)\+(\d+)') {
            $appVersion = $matches[1]
            $buildNumber = $matches[2]
            Write-Host "app_version=$appVersion" >> $env:GITHUB_OUTPUT
            Write-Host "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          }
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows
          path: build/windows/x64/runner/Release/
      - name: Compile Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: "/DAppVersion=${{ steps.extract_version.outputs.app_version }} /DBuildNumber=${{ steps.extract_version.outputs.build_number }}"
      - name: Archive installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows-installer
          path: Installer/windows-x86_64-setup.exe

  build-linux:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Native assets require Rust (super_native_extensions), Zig (libghostty)
      # and Go 1.26+ (tailscale); runners do not ship recent-enough versions.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o /tmp/zig.tar.xz
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          /opt/zig/zig version
          echo "/opt/zig" >> $GITHUB_PATH
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          sudo apt-get install -y libmpv-dev mpv
          sudo apt-get install -y libayatana-appindicator3-dev
          sudo apt-get install -y keybinder-3.0
          sudo apt-get install -y libnotify-dev
          sudo apt-get install -y libsecret-1-dev
          sudo apt-get install -y libcurl4-openssl-dev
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release --no-tree-shake-icons
      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux
          path: build/linux/x64/release/bundle/
      - name: Build AppImage
        run: bash buildtools/build-appimage.sh
      - name: Archive AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-linux-appimage
          path: "./*.AppImage*"

  build-android:
    if: github.event_name == 'push' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --split-per-abi
      - name: Archive Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output-android
          path: build/app/outputs/flutter-apk/app-*-release.apk

  upload-to-s3:
    needs: [build-windows, build-linux, build-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: needs.build-windows.result == 'success'
        name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-windows-installer
          path: ./artifacts/windows
      - if: needs.build-linux.result == 'success'
        name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-linux-appimage
          path: ./artifacts/linux
      - if: needs.build-android.result == 'success'
        name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output-android
          path: ./artifacts/android
      - if: needs.build-windows.result == 'success'
        name: Zip Windows installer
        run: |
          cd ./artifacts/windows
          zip -r ../build-output-windows-installer.zip .
      - if: needs.build-linux.result == 'success'
        name: Zip Linux AppImage
        run: |
          cd ./artifacts/linux
          zip -r ../build-output-linux-appimage.zip .
      - if: needs.build-android.result == 'success'
        name: Prepare Android APKs for upload
        run: |
          mkdir -p ./artifacts/android-r2
          find ./artifacts/android -type f -name 'app-*-release.apk' -exec cp {} ./artifacts/android-r2/ \;
      - if: needs.build-windows.result == 'success'
        name: Upload Windows installer to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.S3_BUCKET_NAME }}
          source-dir: ./artifacts/build-output-windows-installer.zip
          destination-dir: maidkit
      - if: needs.build-linux.result == 'success'
        name: Upload Linux to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.S3_BUCKET_NAME }}
          source-dir: ./artifacts/build-output-linux-appimage.zip
          destination-dir: maidkit
      - if: needs.build-android.result == 'success'
        name: Upload Android split APKs to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.S3_BUCKET_NAME }}
          source-dir: ./artifacts/android-r2
          destination-dir: maidkit
